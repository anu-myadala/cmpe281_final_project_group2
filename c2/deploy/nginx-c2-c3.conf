# nginx for the C1 web container: static Vite build on 8080, same-origin proxies to the
# API (api:8000), the WebSocket, and the C2 / C3 stubs (stubs:8002 and stubs:8003).
# Hostnames are the docker-compose service names; no environment substitution is needed.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream c1_api   { server api:8000; }
upstream c2_stub  { server c2:8002; }
upstream c3_stub  { server c3:8003; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    # Model artifacts are uploaded through /api/v1/storage/objects/... (STORAGE_BACKEND=local).
    client_max_body_size 512m;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # C1 REST API
    location /api/ {
        proxy_pass http://c1_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large uploads to the API instead of spooling them to a temporary file first.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket /ws (also reachable as /api/v1/ws through the block above)
    location /ws {
        proxy_pass http://c1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # C2 (vehicles, devices, telemetry): /c2/api/v1/... -> http://stubs:8002/api/v1/...
    location /c2/ {
        proxy_pass http://c2_stub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # C3 (alerts, alert rules): /c3/api/v1/... -> http://stubs:8003/api/v1/...
    location /c3/ {
        proxy_pass http://c3_stub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed assets can be cached for a long time; index.html must not be.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
