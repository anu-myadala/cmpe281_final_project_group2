# Mosquitto for the SCICP demo stack (docker compose service "mosquitto").
# The C1 API publishes scicp/v1/platform/model/activated (QoS 1, retained) after a model
# activation; the C4 classifier worker of C3 subscribes to it. Anonymous access is enough
# inside the compose network; on a public host restrict the listener or add a password file.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
