# nginx for the scaled platform (docker-compose.scale.yml): the load balancer in front of the
# replicas of the C1 API, C2 and C3, and the web server of the React build on 8080.
#
#   Service discovery  Docker's DNS (127.0.0.11) answers "api", "c2" and "c3" with the address of
#                      every replica; "resolve" re-reads it every 10 s, so replicas added with
#                      "docker compose up -d --scale c2=3" join without a restart of nginx.
#   Balancing          round robin over the replicas (nginx's default);
#   Health             a replica that fails is skipped for 10 s (max_fails,
#                      fail_timeout), and a request that hits a dead replica is retried on the
#                      next one (proxy_next_upstream, up to 3 tries), so stopping a replica loses no
#                      request (docs/LOADTEST.md: 5,625 of 5,625 with one replica of each service stopped);
#   Visibility         X-Upstream in every answer names the replica that served it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream c1_api {
    zone c1_api 64k;
    server api:8000 resolve max_fails=1 fail_timeout=10s;
    keepalive 32;
}
upstream c2_svc {
    zone c2_svc 64k;
    server c2:8002 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}
upstream c3_svc {
    zone c3_svc 64k;
    server c3:8003 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    # Model artifacts are uploaded through /api/v1/storage/objects/... (STORAGE_BACKEND=local).
    client_max_body_size 512m;

    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    proxy_connect_timeout 2s;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # C1 REST API
    location /api/ {
        proxy_pass http://c1_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large uploads to the API instead of spooling them to a temporary file first.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Upstream $upstream_addr always;
    }

    # WebSocket /ws: each connection stays on the replica it was opened on; the replicas share
    # their events over MQTT (EVENT_FANOUT=1), so every socket sees every event.
    location /ws {
        proxy_pass http://c1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # C2 (vehicles, devices, telemetry, console): /c2/... -> http://c2:8002/...
    location /c2/ {
        proxy_pass http://c2_svc/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream $upstream_addr always;
    }

    # C3 (alerts, alert rules): /c3/... -> http://c3:8003/...
    location /c3/ {
        proxy_pass http://c3_svc/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream $upstream_addr always;
    }

    # Hashed assets can be cached for a long time; index.html must not be.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
