# EC2 overrides for the SCICP stack. Used together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#
# Differences from the laptop stack:
#   * no MinIO and no MailHog: the model bucket is Amazon S3 in us-west-2 (the instance role, or
#     AWS_S3_ACCESS_KEY / AWS_S3_SECRET_KEY in .env; the MinIO keys of the base file are never
#     used here), mail goes to the log (MAIL_MODE=log) or to SES
#     (MAIL_MODE=ses with a verified MAIL_FROM); the local-only services are parked behind the
#     "local" profile so that they are not started here;
#   * the web container is published on port 80 and CORS allows the public hostname;
#   * MySQL, MongoDB and Mosquitto stay on the instance (no published database ports).
# .env must set PUBLIC_HOST (the EC2 public DNS name or Elastic IP); deploy/ec2-bootstrap.sh does.

services:
  minio:
    profiles: ["local"]
  minio-init:
    profiles: ["local"]
  mailhog:
    profiles: ["local"]

  mysql:
    ports: !override []
  mongo:
    ports: !override []
  mosquitto:
    ports: !override []

  seed:
    environment:
      S3_ENDPOINT_URL: ""
      S3_PUBLIC_ENDPOINT_URL: ""
      S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-west-2}
    depends_on: !override
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  api:
    environment:
      S3_ENDPOINT_URL: ""
      S3_PUBLIC_ENDPOINT_URL: ""
      S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-west-2}
      MAIL_MODE: ${AWS_MAIL_MODE:-log}
      CORS_ORIGINS: http://${PUBLIC_HOST:-localhost},http://${PUBLIC_HOST:-localhost}:80,http://localhost:8080
      COOKIE_SECURE: "false"
    ports: !override
      - "127.0.0.1:8000:8000"   # API docs through an SSH tunnel only; the browser uses /api on port 80
    depends_on: !override
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  stubs:
    ports: !override
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:8003:8003"

  web:
    ports: !override
      - "80:8080"
