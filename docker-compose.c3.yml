# C3 Alert Tracking and Monitoring (Ray Zhao) on top of the base stack. Adds the real C3 service
# and switches C1, nginx and the stubs over to it without editing any shared file:
#
#   docker compose -f docker-compose.yml -f docker-compose.c3.yml up -d --build
#   EC2: docker compose -f docker-compose.yml -f docker-compose.aws.yml -f docker-compose.c3.yml up -d --build
#        (and C3_PUBLIC_BASE_URL=http://<public-host> in .env for the links in the alert emails)
#
#   c3     the real C3 (c3/), :8003 inside the network; also on 127.0.0.1:8003 for curl and /api/v1/docs
#   api    C3_BASE_URL -> c3 (C1's AlertClient: open alerts, alert detail, map pins)
#   stubs  C2 only (c3/deploy/stubs_c2_only.py): vehicles, devices, telemetry, device faults and the
#          simulated C4 worker keep running; DEMO_MAX_ALERTS=0, so the stub generator creates no alerts
#   web    nginx /c3/ -> c3:8003 (c3/deploy/nginx-default.conf: C1's file with that one line changed)

services:
  c3:
    build:
      context: ./c3
    image: scicp/c3:local
    env_file: .env          # DATABASE_URL, MONGO_URL, JWT_SECRET, SERVICE_TOKEN_SECRET, MAIL_FROM
    environment:
      C1_BASE_URL: http://api:8000/api/v1
      PUBLISHER: http
      MAIL_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      PUBLIC_BASE_URL: ${C3_PUBLIC_BASE_URL:-http://localhost:8080}
      NOTIFY_RETRY_WAITS: "0,30,120"
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    environment:
      C3_BASE_URL: http://c3:8003/api/v1

  stubs:
    command: ["python", "/srv/stubs_c2_only.py"]
    volumes:
      - ./c3/deploy/stubs_c2_only.py:/srv/stubs_c2_only.py:ro
    environment:
      DEMO_MAX_ALERTS: "0"
    ports: !override
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    volumes:
      - ./c3/deploy/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      c3:
        condition: service_healthy
