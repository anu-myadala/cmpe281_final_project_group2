# SCICP local stack (CMPE 281 Group 2): one command runs the C1 API, the web app, the C2/C3 stubs
# with the demo generator and the classifier worker, the seed, and the infrastructure (MySQL 8,
# MongoDB 7, MailHog, Mosquitto). Model artifacts live on the named volume "objects"
# (STORAGE_BACKEND=local); on EC2 they go to Amazon S3 instead (docker-compose.aws.yml).
#
#   cp .env.example .env
#   docker compose up --build
#
#   web        http://localhost:8080          (nginx: static build + /api, /ws, /c2, /c3 proxies)
#   API docs   http://localhost:8000/api/v1/docs
#   MailHog    http://localhost:8025
#   stubs      http://localhost:8002/api/v1/docs (C2), http://localhost:8003/api/v1/docs (C3)
#
# On EC2 add the override: docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build

name: scicp

services:
  # ------------------------------------------------------------------ infrastructure
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: scicp
      MYSQL_USER: scicp
      MYSQL_PASSWORD: scicp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uscicp", "-pscicp"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    # MailHog publishes an amd64 image only; Docker Desktop on Apple silicon runs it under
    # emulation, and saying so here avoids the platform warning. MAIL_MODE=log needs no MailHog.
    platform: linux/amd64
    ports:
      - "8025:8025"   # web UI; SMTP on 1025 inside the network

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"

  # ------------------------------------------------------------------ platform
  # Seed (one-shot): the Deliverable #2 sample data in MySQL, MongoDB and the model artifacts
  # (written to the "objects" volume that the API serves).
  seed:
    build:
      context: .
      dockerfile: c1/api/Dockerfile
    image: scicp/c1-api:local
    env_file: .env
    command: ["python", "-m", "seed.seed"]
    volumes:
      - objects:/data/objects
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: c1/api/Dockerfile
    image: scicp/c1-api:local
    env_file: .env
    environment:
      STUBS_INLINE: "0"
      SEED_ON_START: "0"
    ports:
      - "8000:8000"
    volumes:
      - objects:/data/objects
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # C2 (:8002) and C3 (:8003) stand-ins plus the demo event generator and the simulated C4
  # classifier worker (MQTT model.activated -> download through C1 -> verify -> report).
  # Replaced by the real components later: point C2_BASE_URL / C3_BASE_URL (and the nginx
  # upstreams) at them.
  stubs:
    build:
      context: .
      dockerfile: stubs/Dockerfile
    image: scicp/stubs:local
    env_file: .env
    environment:
      C1_BASE_URL: ${C1_BASE_URL:-http://api:8000/api/v1}
    ports:
      - "8002:8002"
      - "8003:8003"
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./c1/web
    image: scicp/c1-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      stubs:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  mongo-data:
  objects:
  mosquitto-data:
